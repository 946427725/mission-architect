<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission Architect</title>
    <meta name="description" content="Design a real space mission - physics decides if it works. A NASA Space Apps Challenge 2026 game." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='9' fill='%23ffb84d'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='12' fill='none' stroke='%235ad1ff' stroke-width='3' transform='rotate(-25 32 32)'/%3E%3Ccircle cx='56' cy='22' r='4' fill='%23e6eefb'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body data-screen="title">
    <div id="space" aria-hidden="true"></div>
    <header id="topbar"></header>
    <aside id="panel" aria-label="Mission design"></aside>
    <div id="craft-card" aria-label="Spacecraft preview">
      <div id="craft-view"></div>
      <div id="craft-caption" class="caption"></div>
    </div>
    <div id="hud"></div>
    <div id="overlay"></div>
    <div id="tooltip" role="tooltip"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript>Mission Architect needs JavaScript and WebGL.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
